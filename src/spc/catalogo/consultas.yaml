  costo_total: "Gasto total de la orden (cantidad × costo); magnitud de compra en soles."
  lead_time_dias: "Días entre pedir y recibir; mide la rapidez del proveedor."
  cantidad_recibida: "Unidades realmente entregadas; se compara con lo pedido."
  cumplimiento: "Proporción de lo pedido que llegó completo y a tiempo."
  descuento_volumen: "Rebaja por comprar en cantidad; incentiva pedidos grandes."
  # Almacén
  stock_actual: "Existencias disponibles hoy; punto de partida del inventario."
  stock_minimo: "Nivel mínimo antes de reponer; umbral de alerta de quiebre."
  stock_maximo: "Tope de almacenamiento definido para el producto."
  demanda_dia: "Salida de unidades del día; consumo real del inventario."
  demanda_diaria_promedio: "Consumo medio por día; base para estimar cobertura."
  dias_de_cobertura: "Días que dura el stock al ritmo de consumo actual."
  rotacion: "Con qué frecuencia se renueva el inventario; alta = producto ágil."
  tiempo_reposicion_dias: "Días que tarda reabastecer; define cuándo pedir."
  # Objetivos derivados (etiquetas que el modelo predice)
  demanda_alta: "Marca los días/productos de demanda alta (sobre el percentil de su categoría)."
  dia_pico: "Señala si el día será un pico de venta frente a un día normal."
  entrega_con_retraso: "Indica si la orden llegará tarde respecto al plazo esperado."
  cumplimiento_alto: "Distingue proveedores con cumplimiento alto de los flojos."
  tamano_orden: "Clasifica el pedido por tamaño (chico, mediano, grande)."
  riesgo_quiebre: "Alerta de que el stock podría agotarse antes de reponer."
  reposicion_urgente: "Marca productos que necesitan reabastecerse ya."
  sobrestock: "Señala exceso de inventario inmovilizado."

