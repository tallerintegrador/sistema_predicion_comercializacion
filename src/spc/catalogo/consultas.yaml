version: "1.0.0"
fecha_creacion: "2026-07-02"
adr: "ADR-0028"
notas_globales: |
  - Todas las métricas de selección (WAPE, PR-AUC, silueta) son honestas; sin umbrales bloqueantes.
  - Validación temporal por defecto (train/valid/test por fecha); clustering sin partición.
  - Desbalance de clases: class_weight='balanced' en LogReg y RF para clasificación.
  - Clustering: KMeans con escalado StandardScaler; k automático excepto ALM-K1 (k=3 ABC).
  - Derivación de etiquetas: percentil en TRAIN, fórmula determinística para almacén.
  - Sin columnas calculadas como features: ingreso, costo_total, cumplimiento, dias_de_cobertura.
  - Reutiliza orquestación leak-safe de spc.models.automl y spc.service.motor_3x3.
